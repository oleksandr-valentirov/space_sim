# P0 reconnaissance: the "platform x backend x feature" table (ROADMAP, stage
# E).
#
# A separate workflow rather than a step in the determinism gate, deliberately.
# The gate answers "is it broken"; this answers "what exists at all", and that
# answer is needed a few times per project, not on every push. Hence
# workflow_dispatch plus changes to the probe itself.
#
# WARNING: GitHub runners are not gaming machines, and none of the three is an
#   exception. On Windows it is almost certainly WARP (software D3D12), on
#   Linux lavapipe, and on macOS `Apple Paravirtual`, because those runners are
#   virtual machines on arm64 too. The first version of this comment claimed
#   macOS gave a "real" GPU; that was false, and debt D3 rested on it.
#
#   So this table answers "does wgpu support bindless on this API", not "will a
#   player's machine run it". The second question is settled by the developer's
#   hardware (see ROADMAP P0) and later by telemetry.
#
#   Re-running this workflow for D3 is pointless -- the Metal row will come out
#   the same. What will close it, and which two numbers to watch, is recorded
#   in ROADMAP, "Відкриті борги", D3.

name: gpu-probe

on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/gpu-probe/**'
      - '.github/workflows/gpu-probe.yml'

jobs:
  probe:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-latest
          - name: windows
            os: windows-latest
          - name: macos
            os: macos-latest

    steps:
      - uses: actions/checkout@v7

      # Mesa with software Vulkan: without it the Linux runner has no adapter
      # at all and the probe would have nothing to show.
      - name: Mesa
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers vulkan-tools

      # Only -p gpu-probe. Building the whole workspace is beside the point
      # here: core-sys builds the C core, and on Windows the default toolchain
      # is MSVC, on which build.rs deliberately fails (ROADMAP D1).
      - name: Probe
        run: cargo run -p gpu-probe

      - name: Upload table
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gpu-features-${{ matrix.name }}
          path: build/csv/gpu_features.csv
          if-no-files-found: warn
