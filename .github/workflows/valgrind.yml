# Valgrind is a separate workflow, and it is separate for ONE thing: `paths`.
#
# The steps used to live in determinism.yml and cost 8m25s of a 17m10s total --
# half the gate, on every push, including those touching no line of C. The
# "only when C changed" condition could be expressed three ways; the least
# fragile was chosen:
#
#   - an `if:` computing `git diff` in a step needs fetch-depth: 0 and special
#     handling of `github.event.before`, which is all zeros on a new branch;
#   - a third-party paths-filter adds a dependency for what GitHub does itself;
#   - `on: push: paths:` filters at the trigger. The job simply is not created,
#     and there is no code here that could lie.
#
# A larger side benefit than expected: in determinism.yml valgrind ran
# SEQUENTIALLY inside linux-gcc, adding its minutes to the longest job. Here it
# runs in parallel, so even when C did change the total is a maximum, not a
# sum.
#
# WARNING: the filter must include THIS FILE ITSELF. Otherwise an edit to the
#   condition is not checked by that same edit, and a mistake in it shows only
#   the next time someone touches C.
#
# WARNING: if branch protection with required checks ever appears on main, a
#   workflow with `paths` creates NO job rather than a green one, so a required
#   check would hang forever. It cannot be made required then; the right route
#   is a separate always-running stub job, and that decision belongs to that
#   moment.

name: valgrind

on:
  push:
    paths:
      - 'core/**'
      - 'core-sys/**'
      - 'core-rs/**'
      - 'Makefile'
      - '.github/workflows/valgrind.yml'
  pull_request:
    paths:
      - 'core/**'
      - 'core-sys/**'
      - 'core-rs/**'
      - 'Makefile'
      - '.github/workflows/valgrind.yml'
  workflow_dispatch:

jobs:
  valgrind:
    name: valgrind
    runs-on: ubuntu-latest

    env:
      CC: gcc

    steps:
      - uses: actions/checkout@v7

      # Once for the whole job. In determinism.yml the same apt-get sat in two
      # consecutive steps -- both valgrind steps installed the package
      # themselves, because each had to work if the other were disabled.
      - name: Valgrind
        run: |
          sudo apt-get update
          sudo apt-get install -y valgrind

      # C unit tests under valgrind.
      #
      # ASan does not see reads of uninitialised memory at all. Bug K7b was
      # exactly that: `test_target` built a FieldCtx by hand and left most of
      # the struct as whatever was on the stack. `make test` green, `make asan`
      # green, both Linuxes green -- and a segfault on windows-mingw, three
      # steps from the cause. Valgrind names it on the first line: "Conditional
      # jump depends on uninitialised value(s) at accel_field (field.c:303)".
      #
      # One platform is enough: whether such a bug manifests depends on what
      # was on the stack, and valgrind does not ask.
      #
      # THIS IS `make valgrind` FROM THE LOCAL GATE, the same recipe. The
      # duplication is deliberate: the local gate is discipline, CI is
      # mechanism, and when C changed both are worth paying for. When it did
      # not, it runs nowhere -- and that is what closes Q1.
      - name: C unit tests
        run: make valgrind

      # C-Rust boundary memory (ROADMAP D3).
      #
      # WARNING: THIS STEP HAS NO LOCAL EQUIVALENT. `make valgrind` above is
      #   the C unit tests; nobody checks the boundary except this job. That is
      #   why Q1 is not settled as "either CI or local": half the check exists
      #   in exactly one place.
      #
      # The roadmap said "Miri, or at least ASan". This is valgrind, and not as
      # a retreat for want of a tool but as the better tool for the case: the
      # allocations live in C (`malloc` in ephemeris.c), Miri does not see C at
      # all, and ASan would require rebuilding the core with
      # -fsanitize=address, i.e. with flags differing from core/cflags.txt.
      #
      # What this catches that the compiler does not: `compile_fail` doctests
      # prove that double free and use after free are impossible by the
      # construction of the types. They do NOT prove that freeing happens at
      # all. A leak is not a type error, and this is the only way to see it.
      #
      # WARNING: ONLY core-sys and core-rs, and not to save time.
      #
      # The first version ran valgrind over every test binary, and at F3 it
      # failed: engine tests create a wgpu device, that pulls in Mesa's
      # software Vulkan, and Mesa loses 56 bytes in the stack with no symbols
      # at all (`???`, inside a dlopen'd driver). That is not our code, we will
      # not fix it, and making a red gate out of it would train us to ignore
      # red.
      #
      # The C-Rust boundary is the only place the memory is genuinely ours:
      # `malloc` in ephemeris.c and `Drop` in core-rs. The engine allocates no
      # memory of its own, so there is nothing in it to check.
      #
      # `-p core-sys -p core-rs` on `--no-run` is not the same as the jq filter
      # below, and both are needed. The flags say WHAT TO BUILD: without them
      # cargo would build the whole workspace including wgpu, so the job would
      # pay minutes for code the filter then discarded. The filter stays as the
      # guard: dependency test binaries also reach the output.
      - name: C↔Rust boundary
        run: |
          binaries=$(cargo test --no-run --message-format=json \
            -p core-sys -p core-rs \
            | jq -r 'select(.profile.test == true and .executable != null)
                     | select(.package_id | test("core-sys|core-rs"))
                     | .executable')
          if [ -z "$binaries" ]; then
            echo "no core-sys/core-rs test binary found;"
            echo "an empty check would silently 'pass', so this is a failure"
            exit 1
          fi
          echo "$binaries" | while read -r binary; do
            echo "== $binary"
            valgrind --error-exitcode=1 \
                     --leak-check=full \
                     --errors-for-leak-kinds=definite \
                     "$binary"
          done
