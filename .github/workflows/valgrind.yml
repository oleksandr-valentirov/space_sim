# Valgrind — окремий workflow, і окремий він заради ОДНІЄЇ речі: `paths`.
#
# Кроки жили в determinism.yml і коштували там 8м25с з 17м10с загального
# часу — рівно половину гейта, на кожному пуші, включно з тими, що не
# торкались жодного рядка C. Умову «лише коли змінився C» можна було
# поставити трьома способами; обраний — найменш крихкий:
#
#   - `if:` з обчисленням `git diff` у кроці вимагає fetch-depth: 0 і окремої
#     обробки `github.event.before`, який на новій гілці дорівнює нулям;
#   - сторонній paths-filter додає залежність заради того, що GitHub уміє сам;
#   - `on: push: paths:` фільтрує на рівні тригера. Джоб просто не
#     створюється, і жодного коду, який міг би збрехати, тут немає.
#
# Побічний виграш, більший за очікуваний: у determinism.yml valgrind біг
# ПОСЛІДОВНО всередині linux-gcc, тобто додавав свої хвилини до найдовшого
# джоба. Тут він біжить паралельно, і навіть коли C змінився, загальний час
# — це максимум, а не сума.
#
# ⚠ Фільтр обов'язково включає САМ ЦЕЙ ФАЙЛ. Інакше правка умови не
#   перевіряється тією самою правкою, і помилку в ній видно лише наступного
#   разу, коли хтось торкнеться C.
#
# ⚠ Якщо на main колись з'явиться branch protection з required checks —
#   workflow з `paths` НЕ створює джоб, а не створює зелений, тож required
#   check зависне назавжди. Тоді ставити його required не можна; правильний
#   шлях — окремий always-джоб-заглушка, і це рішення приймати тоді.

name: valgrind

on:
  push:
    paths:
      - 'core/**'
      - 'core-sys/**'
      - 'core-rs/**'
      - 'Makefile'
      - '.github/workflows/valgrind.yml'
  pull_request:
    paths:
      - 'core/**'
      - 'core-sys/**'
      - 'core-rs/**'
      - 'Makefile'
      - '.github/workflows/valgrind.yml'
  workflow_dispatch:

jobs:
  valgrind:
    name: valgrind
    runs-on: ubuntu-latest

    env:
      CC: gcc

    steps:
      - uses: actions/checkout@v7

      # Один раз на весь джоб. У determinism.yml той самий apt-get стояв у
      # двох кроках підряд — обидва valgrind-кроки ставили пакет самі, бо
      # кожен мусив працювати, якщо другий вимкнуть.
      - name: Valgrind
        run: |
          sudo apt-get update
          sudo apt-get install -y valgrind

      # Юніт-тести на C під valgrind.
      #
      # ASan не бачить читання неініціалізованої пам'яті — взагалі. Помилка
      # K7b була саме такою: `test_target` збирав FieldCtx руками й лишав
      # більшу частину структури тим, що було на стеку. `make test` зелений,
      # `make asan` зелений, обидва лінукси зелені — і сегфолт на
      # windows-mingw, за три кроки від причини. Valgrind називає її першим
      # рядком: «Conditional jump depends on uninitialised value(s) at
      # accel_field (field.c:303)».
      #
      # Одна платформа достатня: чи проявиться така помилка, залежить від
      # того, що лежало на стеку, а valgrind цього не питає.
      #
      # ЦЕ Й Є `make valgrind` З ЛОКАЛЬНОГО ГЕЙТА, той самий рецепт. Дубль
      # свідомий: локальний гейт — дисципліна, CI — механізм, і коли C
      # змінився, платити за обидва варто. Коли не змінився — не біжить
      # ніде, і саме це закриває Q1.
      - name: C unit tests
        run: make valgrind

      # Пам'ять межі C↔Rust (ROADMAP D3).
      #
      # ⚠ ЛОКАЛЬНОГО ЕКВІВАЛЕНТА В ЦЬОГО КРОКУ НЕМАЄ. `make valgrind` вище —
      #   це юніт-тести на C; межу не перевіряє ніхто, крім цього джоба.
      #   Саме тому Q1 не вирішується як «або CI, або локально»: половина
      #   перевірки існує рівно в одному місці.
      #
      # Роадмап казав «Miri, або хоча б ASan». Тут valgrind, і це не відступ
      # через брак інструмента, а правильніший інструмент для випадку:
      # алокації живуть у C (`malloc` в ephemeris.c), Miri в C не бачить
      # узагалі, а ASan вимагав би перезібрати ядро з -fsanitize=address —
      # тобто з прапорцями, відмінними від core/cflags.txt.
      #
      # Що це ловить, чого не ловить компілятор: `compile_fail`-доктести
      # доводять, що подвійне звільнення й використання після звільнення
      # неможливі за конструкцією типів. Вони НЕ доводять, що звільнення
      # взагалі відбувається. Витік — це не помилка типів, і побачити його
      # можна тільки так.
      #
      # ⚠ ТІЛЬКИ core-sys і core-rs, і це не економія часу.
      #
      # Перша версія ганяла valgrind по всіх тестових бінарниках, і на F3
      # вона впала: тести рушія створюють пристрій wgpu, той тягне програмний
      # Vulkan від Mesa, а Mesa губить 56 байт у стеку без жодного символу
      # (`???` — усередині dlopen-нутого драйвера). Це не наш код, ми його не
      # полагодимо, і робити з нього червоний гейт означає привчити себе
      # ігнорувати червоне.
      #
      # Межа C↔Rust — єдине місце, де пам'ять справді наша: там `malloc` у
      # ephemeris.c і `Drop` у core-rs. Рушій власної пам'яті не виділяє
      # взагалі, тож перевіряти в ньому нічого.
      #
      # `-p core-sys -p core-rs` у `--no-run` — не те саме, що фільтр jq
      # нижче, і потрібні обидва. Прапорці кажуть, ЩО ЗБИРАТИ: без них
      # cargo зібрав би весь workspace разом із wgpu, тобто джоб платив би
      # хвилини за код, який потім відкинув би фільтр. Фільтр же лишається
      # сторожем: у вивід потрапляють і тестові бінарники залежностей.
      - name: C↔Rust boundary
        run: |
          binaries=$(cargo test --no-run --message-format=json \
            -p core-sys -p core-rs \
            | jq -r 'select(.profile.test == true and .executable != null)
                     | select(.package_id | test("core-sys|core-rs"))
                     | .executable')
          if [ -z "$binaries" ]; then
            echo "не знайдено жодного тестового бінарника core-sys/core-rs;"
            echo "порожня перевірка мовчки 'проходить', тому це провал"
            exit 1
          fi
          echo "$binaries" | while read -r binary; do
            echo "== $binary"
            valgrind --error-exitcode=1 \
                     --leak-check=full \
                     --errors-for-leak-kinds=definite \
                     "$binary"
          done
