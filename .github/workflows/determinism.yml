# Крос-платформна перевірка детермінізму — гейт M0 (ROADMAP C5).
#
# Що саме перевіряється: `make determinism` звіряє хеші сценаріїв з
# core/scenario/golden.txt, закоміченим один раз. Якщо джоб зелений на всіх
# платформах — значить усі порахували БІТОВО однакові числа. Окремого кроку
# «порівняти платформи між собою» не треба: еталон один на всіх.
#
# Матриця навмисно містить два компілятори на Linux. Розбіжність gcc/clang
# на одній машині шукається набагато дешевше за розбіжність Linux/Windows,
# і ловить ту саму причину — тож нехай падає раніше й ближче.
#
# Windows іде через MSYS2, а не MSVC. Збірка тут — це Makefile, `nm` і `sh`,
# і MSYS2 дає їх усі; той самий UCRT64-gcc збирає ядро й під `cargo`. MSVC не
# підтримується свідомо: core/cflags.txt написаний під gcc, і
# `core-sys/build.rs` на MSVC падає з поясненням, а не збирає щось інше мовчки.
# Тому на Windows тулчейн Rust — x86_64-pc-windows-gnu, і ставить його крок
# «Rust (windows-gnu)» нижче.
#
# Якщо перший запуск розійдеться, порядок пошуку — у ROADMAP C5:
#   1. прапорці справді однакові (`make flags` у логах нижче);
#   2. «поліція libm» відпрацювала на всіх платформах;
#   3. ділити сценарій навпіл, поки не локалізується перша розбіжна операція.
# Крок 3 уже підготовлено: сценаріїв одинадцять, і кожен покриває свій шар.

name: determinism

# `paths-ignore` знімає рівно те, що дратувало: правка одного рядка в ROADMAP
# коштувала повного гейта. Жоден .md не бере участі в збірці, тож пропуск тут
# нічого не послаблює. Семантика саме та, що потрібна: коміт, який чіпає і
# документ, і код, під фільтр НЕ підпадає й запускає все.
#
# Valgrind живе окремо — .github/workflows/valgrind.yml, з власним `paths`.
#
# ⚠ Та сама засторога, що й там: workflow з фільтром не створює джоб, а не
#   створює зелений. Ставити його required check у branch protection можна
#   тільки разом із джобом-заглушкою.
on:
  push:
    paths-ignore:
      - '**.md'
  pull_request:
    paths-ignore:
      - '**.md'
  workflow_dispatch:

jobs:
  gate:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    # Оболонка задається саме тут, а не в кроках. `steps[*].shell` не приймає
    # ЖОДНОГО контексту — ні matrix, ні будь-якого іншого, — тож `${{ matrix.shell }}`
    # у кроці не просто не спрацює, а зламає весь файл: GitHub відхиляє його
    # цілком, джоби не створюються, і в UI workflow називається шляхом до файлу
    # замість свого імені. `defaults.run.shell` matrix підтримує.
    #
    # Перевіряти локально перед пушем: actionlint (github.com/rhysd/actionlint).
    defaults:
      run:
        shell: ${{ matrix.shell }}

    # Без fail-fast: коли платформи розходяться, потрібні ВСІ результати,
    # а не перший провалений. Дві збіжні платформи проти однієї — це вже
    # напівдіагноз.
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-gcc
            os: ubuntu-latest
            cc: gcc
            shell: bash
          - name: linux-clang
            os: ubuntu-latest
            cc: clang
            shell: bash
          - name: macos-clang
            os: macos-latest
            cc: clang
            shell: bash
          - name: windows-mingw
            os: windows-latest
            cc: gcc
            shell: 'msys2 {0}'

    steps:
      - uses: actions/checkout@v7

      - name: MSYS2
        id: msys2
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false

          # Не тягнути базову інсталяцію з GitHub Releases, а взяти ту, що вже
          # є на образі раннера. Перший запуск упав саме тут — 503 від
          # роздачі. Мережа лишається в грі через pacman нижче, але це
          # набагато менший і дешевший шлях, ніж викачувати весь MSYS2.
          release: false
          # Явно все, чим користується Makefile і scripts/check_no_libm.sh:
          # sed і tr читають cflags.txt, diff звіряє хеші, awk і find працюють
          # у «поліції libm», nm — з binutils саме під UCRT64, щоб формат
          # об'єктних файлів збігався з тим, що видає цей gcc.
          install: >-
            make
            diffutils
            coreutils
            findutils
            gawk
            grep
            sed
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-binutils

      # Тулчейн Rust для Windows — gnu, не MSVC. Той самий рецепт, яким борг
      # D1 закривали на реальній машині розробника; тут він лише переїхав
      # у раннер.
      #
      # Тулчейн вибирається через RUSTUP_TOOLCHAIN, а не `rustup default` і
      # не `rustup override set`. Причина — старшинство: `default` програє
      # rust-toolchain.toml (той каже `channel = "stable"`, що на Windows
      # розгорнеться в msvc), а каталожний override і файл змагаються за
      # правилом, яке доводиться пам'ятати. Змінна оточення старша за обидва,
      # тож тут нічого пам'ятати не треба. Помилка в цьому виборі не була б
      # тихою — build.rs упав би повідомленням про MSVC, — але впала б за три
      # кроки від причини.
      #
      # ucrt64\bin у PATH — щоб `cc` і лінкер gnu-цілі взяли ТОЙ САМИЙ gcc,
      # яким збирає `make` двома кроками нижче. Інакше звірялися б хеші двох
      # різних збірок ядра, і їхній збіг не доводив би нічого про cargo.
      #
      # ⚠ Оболонка тут pwsh, а не msys2: rustup і cargo — рідні для Windows,
      #   і тягнути їх у msys2-шелл довелося б через path-type: inherit, що
      #   міняє PATH усім крокам, включно з тими, які зараз працюють.
      #   Літерал у `shell:` дозволений — не дозволений там КОНТЕКСТ
      #   (`${{ matrix.shell }}`), про що сказано вище коло defaults.
      - name: Rust (windows-gnu)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          RUSTUP_TOOLCHAIN: stable-x86_64-pc-windows-gnu
        run: |
          $ucrt = "${{ steps.msys2.outputs.msys2-location }}\ucrt64\bin"
          # GITHUB_PATH діє на НАСТУПНІ кроки, тож для власного `gcc --version`
          # нижче PATH треба поправити ще й тут.
          $ucrt | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          $env:PATH = "$ucrt;$env:PATH"
          rustup toolchain install stable-x86_64-pc-windows-gnu
          rustc -vV
          gcc --version

      # Прапорці в лог, до будь-якої збірки. Розбіжність хешів починають
      # шукати саме тут, і мати їх у логах кожного джоба економить один цикл.
      #
      # uname -m тут не для повноти: воно фіксує, що macOS-раннер — arm64,
      # тобто гейт порівнює дві РІЗНІ архітектури, а не лише три компілятори.
      # Це найсильніша частина твердження про детермінізм, і вона має бути
      # підтверджена логом, а не припущенням про образи GitHub.
      - name: Flags
        run: |
          uname -srm
          make --version | head -1
          make flags
          ${{ matrix.cc }} --version

      - name: Build and check
        env:
          CC: ${{ matrix.cc }}
        run: make test

      # Юніт-тести на C під ASan+UBSan (`make asan` пояснює прапорці).
      #
      # Дірку, яку це закриває, знайшов не CI, а macOS — сегфолтом у
      # test_prop, за два кроки від причини. Valgrind (тепер у
      # .github/workflows/valgrind.yml) свідомо дивиться лише на core-sys і
      # core-rs, тобто на пам'ять, яку виділяє межа; сотню юніт-тестів на C не
      # перевіряв ніхто, і в одному з них блок пропагував через звільнений
      # контекст. На glibc це «працює» — звільнений блок лишається
      # змапленим, — тож обидва лінукси були зелені, а впала та платформа,
      # яка повертає пам'ять ОС одразу.
      #
      # ASan лишається ТУТ, а не переїжджає до valgrind: він біжить на кожен
      # пуш свідомо. Ціна — хвилини, а не вісім із половиною, і ловить він
      # клас, який зачіпає й Rust-правки теж (звільнений контекст живе в
      # тестах C, але приходить туди з межі).
      #
      # Одна платформа тут достатня, і саме тому це не матриця: помилка
      # пам'яті не залежить від того, хто її знайшов, а від алокатора
      # залежить лише те, чи вона проявиться. Санітайзер не питає алокатора.
      #
      # Чому окремим кроком, а не всередині `make test`: перезбирає ядро
      # заново з іншими прапорцями, і в червоному логу має бути видно, що
      # впала саме перевірка пам'яті, а не числа.
      - name: ASan + UBSan
        if: matrix.name == 'linux-gcc'
        env:
          CC: ${{ matrix.cc }}
        run: make asan

      # Експортери CSV — тільки зібрати й запустити, і ЦЕ НЕ ЧАСТИНА ГЕЙТА.
      # Їхній вивід між платформами не звіряється й звірятися не може: друк
      # double у десятковий текст — справа libc, а не IEEE (core/export/csv.h).
      # Перевіряється рівно одне — що вони компілюються й доходять до кінця,
      # бо інакше вони тихо згниють: тести їх не чіпають, а руками їх ганяють
      # лише коли треба подивитися на графік. Коштує пів секунди.
      - name: Export CSV
        env:
          CC: ${{ matrix.cc }}
        run: make csv

      # matplotlib на раннерах немає й ставити його заради цього не варто, але
      # синтаксичну помилку в скрипті ловити десь треба.
      - name: Check plot script
        if: matrix.name == 'linux-gcc'
        run: python3 -m py_compile scripts/plot.py

      # ЦЕ ЧАСТИНА ГЕЙТА (ROADMAP D1). core-sys/build.rs збирає ті самі .c
      # крейтом `cc`, і тест звіряє хеші з тим самим core/scenario/golden.txt.
      # Тобто перевіряється не «cargo дає те саме, що make на цій машині», а
      # «cargo дає те саме, що еталон» — еталон один на всіх, і саме тому
      # окремого кроку «порівняти дві збірки» тут немає.
      #
      # CC передається той самий, що і в make: на linux-clang ядро для cargo
      # теж збере clang, і розбіжність gcc/clang усередині cargo впаде тут.
      #
      # Windows має власну пару кроків нижче — інша оболонка й вужчий набір
      # крейтів. Чому саме так, сказано там.
      # Програмний Vulkan для тестів рушія: без адаптера вони пропускаються,
      # а мовчазний пропуск — це зелений тест, який нічого не перевіряє.
      # macOS має Metal сам.
      - name: Mesa
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers

      - name: Cargo determinism
        if: runner.os != 'Windows'
        env:
          CC: ${{ matrix.cc }}
        run: |
          cargo run -q --example flags
          cargo test

      # Профіль cargo не має протікати в C: прапорці ядра задає
      # core/cflags.txt, а не рівень оптимізації Rust. Release-прогін і є
      # перевіркою цього твердження — хеші мусять лишитись ті самі.
      - name: Cargo determinism (release)
        if: runner.os != 'Windows'
        env:
          CC: ${{ matrix.cc }}
        run: cargo test --release

      # Те саме на Windows — але ТІЛЬКИ core-sys і core-rs, і це не економія
      # часу.
      #
      # Перевіряється рівно одне твердження, і воно живе в цих двох крейтах:
      # ядро, зібране крейтом `cc` на Windows, дає ті самі хеші, що еталон.
      # `game` притягнув би `engine`, тобто wgpu і winit, а тести рушія без
      # адаптера мовчки пропускаються — зелений тест, який нічого не
      # перевіряє, гірший за свою відсутність (та сама причина, з якої вище
      # ставиться Mesa). Програмний D3D12 сюди — окреме рішення, не це.
      #
      # Той самий поділ, що у workflow valgrind.yml, і з тієї ж причини: межа
      # C↔Rust — єдине, що на цій платформі ще не було перевірене під cargo.
      #
      # Двома кроками, а не одним, як і на решті платформ: у червоному логу
      # має бути видно, debug чи release.
      - name: Cargo determinism (windows-gnu)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          CC: ${{ matrix.cc }}
          RUSTUP_TOOLCHAIN: stable-x86_64-pc-windows-gnu
        run: |
          cargo run -q -p core-sys --example flags
          cargo test -p core-sys -p core-rs

      - name: Cargo determinism (windows-gnu, release)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          CC: ${{ matrix.cc }}
          RUSTUP_TOOLCHAIN: stable-x86_64-pc-windows-gnu
        run: cargo test --release -p core-sys -p core-rs

      # Пікселеві тести на Windows, через WARP (ROADMAP-UI.md, U6c).
      #
      # Це те «окреме рішення», яке крок вище відкладав. Діра, яку воно
      # закриває, дорога: `Gpu::for_tests` без адаптера друкує «ПРОПУЩЕНО» й
      # повертає зелене, тож увесь пікселевий доказ (силует планети R1e,
      # нерухомий Місяць U6a3, панелі U1c) на Windows не виконувався взагалі —
      # а саме Windows колись спіймав UB, якого не бачила жодна інша
      # платформа (K7b).
      #
      # WARP — програмний растеризатор D3D12, він є в системі за
      # замовчуванням. `Gpu::new` бере його сам: апаратного адаптера на
      # раннері немає, і другий запит іде з `force_fallback_adapter`.
      #
      # SPACE_SIM_REQUIRE_GPU перетворює пропуск на помилку: без цього крок
      # був би зеленим і тоді, коли WARP не знайшовся, тобто перевіряв би
      # рівно нічого. Назву адаптера кожен тест друкує в лог — саме за нею
      # видно, що це WARP, а не щось інше.
      - name: GPU tests (WARP)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          CC: ${{ matrix.cc }}
          RUSTUP_TOOLCHAIN: stable-x86_64-pc-windows-gnu
          WGPU_BACKEND: dx12
          SPACE_SIM_REQUIRE_GPU: '1'
        run: cargo test -p engine -p game -- --nocapture

      - name: Clippy
        if: matrix.name == 'linux-gcc'
        env:
          CC: ${{ matrix.cc }}
        run: cargo clippy --all-targets -- -D warnings

      # Форматування — це не смак, а відсутність суперечки про смак. Приймаємо
      # rustfmt як є, включно з тими місцями, де він розбиває читабельний
      # однорядковий виклик на чотири.
      - name: Rustfmt
        if: matrix.name == 'linux-gcc'
        run: cargo fmt --check

      # Обидва valgrind-кроки — юніт-тести на C і пам'ять межі C↔Rust (D3) —
      # переїхали у .github/workflows/valgrind.yml, з фільтром `paths`.
      # Причини й застороги записані там; тут лишається сам факт, щоб їх не
      # шукали в цьому файлі.

      # Завжди, навіть коли впало: у провалі саме хеші й потрібні.
      - name: Hashes
        if: always()
        run: cat build/scenario/actual.txt || true

      - name: Upload hashes
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: hashes-${{ matrix.name }}
          path: build/scenario/actual.txt
          if-no-files-found: warn
