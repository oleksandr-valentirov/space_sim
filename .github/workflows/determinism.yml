# Cross-platform determinism check -- the M0 gate (ROADMAP C5).
#
# What is checked: `make determinism` compares scenario hashes against
# core/scenario/golden.txt, committed once. If the job is green on every
# platform, they all computed BIT-identical numbers. No separate "compare the
# platforms" step is needed: there is one golden file for all of them.
#
# The matrix deliberately holds two compilers on Linux. A gcc/clang divergence
# on one machine is far cheaper to chase than a Linux/Windows one, and it
# catches the same cause -- so let it fail earlier and closer.
#
# Windows goes through MSYS2, not MSVC. The build here is a Makefile, `nm` and
# `sh`, and MSYS2 provides all of them; the same UCRT64 gcc builds the core
# under `cargo` too. MSVC is deliberately unsupported: core/cflags.txt is
# written for gcc, and `core-sys/build.rs` fails on MSVC with an explanation
# rather than silently building something else. Hence the Rust toolchain on
# Windows is x86_64-pc-windows-gnu, installed by the "Rust (windows-gnu)" step
# below.
#
# If a first run diverges, the search order is in ROADMAP C5:
#   1. the flags really are identical (`make flags` in the logs below);
#   2. the "libm police" ran on every platform;
#   3. bisect the scenario until the first divergent operation is located.
# Step 3 is already prepared: the scenarios are split by layer, so a bisection
# has somewhere to land.

name: determinism

# `paths-ignore` removes exactly what was annoying: a one-line ROADMAP edit
# cost a full gate. No .md takes part in the build, so skipping weakens
# nothing. The semantics are the ones wanted: a commit touching both a document
# and code does NOT match the filter and runs everything.
#
# Valgrind lives separately -- .github/workflows/valgrind.yml, with its own
# `paths`.
#
# WARNING, same as there: a filtered workflow creates no job rather than a
#   green one. Making it a required check in branch protection is only safe
#   alongside a stub job.
on:
  push:
    paths-ignore:
      - '**.md'
  pull_request:
    paths-ignore:
      - '**.md'
  workflow_dispatch:

jobs:
  gate:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    # The shell is set here, not in the steps. `steps[*].shell` accepts NO
    # context at all -- not matrix, not any other -- so `${{ matrix.shell }}`
    # in a step does not merely fail to work, it breaks the whole file: GitHub
    # rejects it entirely, no jobs are created, and the UI names the workflow
    # by its file path instead of its name. `defaults.run.shell` does support
    # matrix.
    #
    # Check locally before pushing: actionlint (github.com/rhysd/actionlint).
    defaults:
      run:
        shell: ${{ matrix.shell }}

    # No fail-fast: when platforms diverge, ALL results are needed, not the
    # first failure. Two agreeing platforms against one is already half a
    # diagnosis.
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-gcc
            os: ubuntu-latest
            cc: gcc
            shell: bash
          - name: linux-clang
            os: ubuntu-latest
            cc: clang
            shell: bash
          - name: macos-clang
            os: macos-latest
            cc: clang
            shell: bash
          - name: windows-mingw
            os: windows-latest
            cc: gcc
            shell: 'msys2 {0}'

    steps:
      - uses: actions/checkout@v7

      - name: MSYS2
        id: msys2
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false

          # Do not pull the base installation from GitHub Releases; take the
          # one already on the runner image. The first run failed exactly here
          # -- a 503 from the download. The network is still in play via pacman
          # below, but that is a much smaller and cheaper path than fetching
          # all of MSYS2.
          release: false
          # Everything the Makefile and scripts/check_no_libm.sh use, spelled
          # out: sed and tr read cflags.txt, diff compares hashes, awk and find
          # work in the "libm police", and nm comes from UCRT64 binutils so the
          # object file format matches what this gcc emits.
          install: >-
            make
            diffutils
            coreutils
            findutils
            gawk
            grep
            sed
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-binutils

      # The Rust toolchain for Windows is gnu, not MSVC. The same recipe that
      # closed debt D1 on the developer's own machine, moved into the runner.
      #
      # The toolchain is selected through RUSTUP_TOOLCHAIN, not `rustup
      # default` and not `rustup override set`. The reason is precedence:
      # `default` loses to rust-toolchain.toml (which says `channel =
      # "stable"`, resolving to msvc on Windows), while a directory override
      # and the file compete by a rule one has to remember. The environment
      # variable outranks both, so there is nothing to remember here. Getting
      # this wrong would not be silent -- build.rs would fail with a message
      # about MSVC -- but it would fail three steps from the cause.
      #
      # ucrt64\bin on PATH so that `cc` and the gnu-target linker pick THE
      # SAME gcc that `make` uses two steps below. Otherwise the hashes of two
      # different core builds would be compared, and their agreement would
      # prove nothing about cargo.
      #
      # WARNING: the shell here is pwsh, not msys2: rustup and cargo are
      #   native Windows tools, and dragging them into the msys2 shell would
      #   require path-type: inherit, which changes PATH for every step,
      #   including those that currently work. A literal in `shell:` is
      #   allowed -- what is not allowed there is CONTEXT
      #   (`${{ matrix.shell }}`), as noted above near defaults.
      - name: Rust (windows-gnu)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          RUSTUP_TOOLCHAIN: stable-x86_64-pc-windows-gnu
        run: |
          $ucrt = "${{ steps.msys2.outputs.msys2-location }}\ucrt64\bin"
          # GITHUB_PATH affects SUBSEQUENT steps, so PATH must also be fixed
          # here for this step's own `gcc --version` below.
          $ucrt | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          $env:PATH = "$ucrt;$env:PATH"
          rustup toolchain install stable-x86_64-pc-windows-gnu
          rustc -vV
          gcc --version

      # Flags into the log before any build. A hash divergence is investigated
      # starting here, and having them in every job's log saves one cycle.
      #
      # `uname -m` is not for completeness: it records that the macOS runner is
      # arm64, i.e. the gate compares two DIFFERENT architectures, not merely
      # three compilers. That is the strongest part of the determinism claim,
      # and it should be confirmed by a log rather than by an assumption about
      # GitHub's images.
      - name: Flags
        run: |
          uname -srm
          make --version | head -1
          make flags
          ${{ matrix.cc }} --version

      - name: Build and check
        env:
          CC: ${{ matrix.cc }}
        run: make test

      # C unit tests under ASan+UBSan (`make asan` explains the flags).
      #
      # The hole this closes was found not by CI but by macOS -- a segfault in
      # test_prop, two steps from the cause. Valgrind (now in
      # .github/workflows/valgrind.yml) deliberately looks only at core-sys and
      # core-rs, i.e. memory the boundary allocates; nobody checked the hundred
      # C unit tests, and in one of them a block propagated through a freed
      # context. On glibc that "works" -- the freed block stays mapped -- so
      # both Linuxes were green and the platform that returns memory to the OS
      # immediately was the one that fell over.
      #
      # ASan stays HERE rather than moving to valgrind: it runs on every push
      # deliberately. The cost is minutes, not eight and a half, and it catches
      # a class that touches Rust edits too (the freed context lives in the C
      # tests but arrives there from the boundary).
      #
      # One platform is enough, which is why this is not a matrix: a memory bug
      # does not depend on who found it, and the allocator affects only whether
      # it manifests. A sanitizer does not ask the allocator.
      #
      # Why a separate step rather than inside `make test`: it rebuilds the
      # core with different flags, and a red log should show that the memory
      # check failed, not the numbers.
      - name: ASan + UBSan
        if: matrix.name == 'linux-gcc'
        env:
          CC: ${{ matrix.cc }}
        run: make asan

      # CSV exporters -- build and run only, and THIS IS NOT PART OF THE GATE.
      # Their output is not compared across platforms and cannot be: printing a
      # double as decimal text is libc's business, not IEEE's
      # (core/export/csv.h). Exactly one thing is checked -- that they compile
      # and run to completion -- because otherwise they rot silently: no test
      # touches them, and they are run by hand only when someone wants a plot.
      # Costs half a second.
      - name: Export CSV
        env:
          CC: ${{ matrix.cc }}
        run: make csv

      # The runners have no matplotlib and installing it for this is not worth
      # it, but a syntax error in the script has to be caught somewhere.
      - name: Check plot script
        if: matrix.name == 'linux-gcc'
        run: python3 -m py_compile scripts/plot.py

      # THIS IS PART OF THE GATE (ROADMAP D1). core-sys/build.rs builds the
      # same .c files with the `cc` crate, and the test compares hashes against
      # the same core/scenario/golden.txt. So what is checked is not "cargo
      # agrees with make on this machine" but "cargo agrees with the golden
      # file" -- one golden file for all, which is why there is no separate
      # "compare the two builds" step.
      #
      # CC is the same as for make: on linux-clang cargo's core is built by
      # clang too, so a gcc/clang divergence inside cargo fails here.
      #
      # Windows has its own pair of steps below -- different shell, narrower
      # set of crates. The reason is given there.

      # Software Vulkan for the engine tests: without an adapter they are
      # skipped, and a silent skip is a green test that checks nothing. macOS
      # has Metal of its own.
      - name: Mesa
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers

      - name: Cargo determinism
        if: runner.os != 'Windows'
        env:
          CC: ${{ matrix.cc }}
        run: |
          cargo run -q --example flags
          cargo test

      # The cargo profile must not leak into C: core flags come from
      # core/cflags.txt, not from Rust's optimisation level. The release run is
      # the check of that claim -- the hashes must stay the same.
      - name: Cargo determinism (release)
        if: runner.os != 'Windows'
        env:
          CC: ${{ matrix.cc }}
        run: cargo test --release

      # The same on Windows -- but ONLY core-sys and core-rs, and not to save
      # time.
      #
      # Exactly one claim is checked, and it lives in these two crates: the
      # core built by the `cc` crate on Windows produces the same hashes as the
      # golden file. `game` would pull in `engine`, i.e. wgpu and winit, and
      # engine tests without an adapter are silently skipped -- a green test
      # that checks nothing is worse than no test (the same reason Mesa is
      # installed above). Software D3D12 here is a separate decision, below.
      #
      # The same split as in valgrind.yml, for the same reason: the C-Rust
      # boundary is the only thing on this platform not yet checked under
      # cargo.
      #
      # Two steps rather than one, as on the other platforms: a red log should
      # show whether it was debug or release.
      - name: Cargo determinism (windows-gnu)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          CC: ${{ matrix.cc }}
          RUSTUP_TOOLCHAIN: stable-x86_64-pc-windows-gnu
        run: |
          cargo run -q -p core-sys --example flags
          cargo test -p core-sys -p core-rs

      - name: Cargo determinism (windows-gnu, release)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          CC: ${{ matrix.cc }}
          RUSTUP_TOOLCHAIN: stable-x86_64-pc-windows-gnu
        run: cargo test --release -p core-sys -p core-rs

      # Pixel tests on Windows, through WARP (ROADMAP-UI.md, U6c).
      #
      # This is the "separate decision" the step above deferred. The hole it
      # closes is expensive: `Gpu::for_tests` without an adapter prints
      # "SKIPPED" and returns green, so the whole pixel proof (planet
      # silhouette R1e, stationary Moon U6a3, panels U1c) did not run on
      # Windows at all -- and Windows is precisely the platform that once
      # caught UB no other platform saw (K7b).
      #
      # WARP is the D3D12 software rasteriser, present in the system by
      # default. `Gpu::new` picks it up itself: there is no hardware adapter on
      # the runner, so the second request goes with
      # `force_fallback_adapter`.
      #
      # SPACE_SIM_REQUIRE_GPU turns a skip into an error: without it the step
      # would be green even when WARP was not found, i.e. it would check
      # exactly nothing. Every test prints the adapter name into the log --
      # that is how one sees it is WARP and not something else.
      - name: GPU tests (WARP)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          CC: ${{ matrix.cc }}
          RUSTUP_TOOLCHAIN: stable-x86_64-pc-windows-gnu
          WGPU_BACKEND: dx12
          SPACE_SIM_REQUIRE_GPU: '1'
        run: cargo test -p engine -p game -- --nocapture

      - name: Clippy
        if: matrix.name == 'linux-gcc'
        env:
          CC: ${{ matrix.cc }}
        run: cargo clippy --all-targets -- -D warnings

      # Formatting is not taste, it is the absence of an argument about taste.
      # We take rustfmt as it comes, including where it splits a readable
      # one-line call across four.
      - name: Rustfmt
        if: matrix.name == 'linux-gcc'
        run: cargo fmt --check

      # Both valgrind steps -- C unit tests and C-Rust boundary memory (D3) --
      # moved to .github/workflows/valgrind.yml, with a `paths` filter. The
      # reasons and warnings are recorded there; only the fact stays here so
      # nobody looks for them in this file.

      # Always, even on failure: the hashes are exactly what a failure needs.
      - name: Hashes
        if: always()
        run: cat build/scenario/actual.txt || true

      - name: Upload hashes
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: hashes-${{ matrix.name }}
          path: build/scenario/actual.txt
          if-no-files-found: warn
