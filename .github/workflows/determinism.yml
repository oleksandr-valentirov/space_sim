# Крос-платформна перевірка детермінізму — гейт M0 (ROADMAP C5).
#
# Що саме перевіряється: `make determinism` звіряє хеші сценаріїв з
# core/scenario/golden.txt, закоміченим один раз. Якщо джоб зелений на всіх
# платформах — значить усі порахували БІТОВО однакові числа. Окремого кроку
# «порівняти платформи між собою» не треба: еталон один на всіх.
#
# Матриця навмисно містить два компілятори на Linux. Розбіжність gcc/clang
# на одній машині шукається набагато дешевше за розбіжність Linux/Windows,
# і ловить ту саму причину — тож нехай падає раніше й ближче.
#
# Windows іде через MSYS2, а не MSVC. На M0 збірка — це Makefile, `nm` і `sh`,
# і MSYS2 дає їх усі. MSVC з'явиться на M1 разом з `cargo` і крейтом `cc`
# (ROADMAP D1), і тоді ж доведеться звірити його прапорці з core/cflags.txt —
# це вже записано як борг у ROADMAP A1.
#
# Якщо перший запуск розійдеться, порядок пошуку — у ROADMAP C5:
#   1. прапорці справді однакові (`make flags` у логах нижче);
#   2. «поліція libm» відпрацювала на всіх платформах;
#   3. ділити сценарій навпіл, поки не локалізується перша розбіжна операція.
# Крок 3 уже підготовлено: сценаріїв одинадцять, і кожен покриває свій шар.

name: determinism

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  gate:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    # Оболонка задається саме тут, а не в кроках. `steps[*].shell` не приймає
    # ЖОДНОГО контексту — ні matrix, ні будь-якого іншого, — тож `${{ matrix.shell }}`
    # у кроці не просто не спрацює, а зламає весь файл: GitHub відхиляє його
    # цілком, джоби не створюються, і в UI workflow називається шляхом до файлу
    # замість свого імені. `defaults.run.shell` matrix підтримує.
    #
    # Перевіряти локально перед пушем: actionlint (github.com/rhysd/actionlint).
    defaults:
      run:
        shell: ${{ matrix.shell }}

    # Без fail-fast: коли платформи розходяться, потрібні ВСІ результати,
    # а не перший провалений. Дві збіжні платформи проти однієї — це вже
    # напівдіагноз.
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-gcc
            os: ubuntu-latest
            cc: gcc
            shell: bash
          - name: linux-clang
            os: ubuntu-latest
            cc: clang
            shell: bash
          - name: macos-clang
            os: macos-latest
            cc: clang
            shell: bash
          - name: windows-mingw
            os: windows-latest
            cc: gcc
            shell: 'msys2 {0}'

    steps:
      - uses: actions/checkout@v4

      - name: MSYS2
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false

          # Не тягнути базову інсталяцію з GitHub Releases, а взяти ту, що вже
          # є на образі раннера. Перший запуск упав саме тут — 503 від
          # роздачі. Мережа лишається в грі через pacman нижче, але це
          # набагато менший і дешевший шлях, ніж викачувати весь MSYS2.
          release: false
          # Явно все, чим користується Makefile і scripts/check_no_libm.sh:
          # sed і tr читають cflags.txt, diff звіряє хеші, awk і find працюють
          # у «поліції libm», nm — з binutils саме під UCRT64, щоб формат
          # об'єктних файлів збігався з тим, що видає цей gcc.
          install: >-
            make
            diffutils
            coreutils
            findutils
            gawk
            grep
            sed
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-binutils

      # Прапорці в лог, до будь-якої збірки. Розбіжність хешів починають
      # шукати саме тут, і мати їх у логах кожного джоба економить один цикл.
      #
      # uname -m тут не для повноти: воно фіксує, що macOS-раннер — arm64,
      # тобто гейт порівнює дві РІЗНІ архітектури, а не лише три компілятори.
      # Це найсильніша частина твердження про детермінізм, і вона має бути
      # підтверджена логом, а не припущенням про образи GitHub.
      - name: Flags
        run: |
          uname -srm
          make --version | head -1
          make flags
          ${{ matrix.cc }} --version

      - name: Build and check
        env:
          CC: ${{ matrix.cc }}
        run: make test

      # Експортери CSV — тільки зібрати й запустити, і ЦЕ НЕ ЧАСТИНА ГЕЙТА.
      # Їхній вивід між платформами не звіряється й звірятися не може: друк
      # double у десятковий текст — справа libc, а не IEEE (core/export/csv.h).
      # Перевіряється рівно одне — що вони компілюються й доходять до кінця,
      # бо інакше вони тихо згниють: тести їх не чіпають, а руками їх ганяють
      # лише коли треба подивитися на графік. Коштує пів секунди.
      - name: Export CSV
        env:
          CC: ${{ matrix.cc }}
        run: make csv

      # matplotlib на раннерах немає й ставити його заради цього не варто, але
      # синтаксичну помилку в скрипті ловити десь треба.
      - name: Check plot script
        if: matrix.name == 'linux-gcc'
        run: python3 -m py_compile scripts/plot.py

      # ЦЕ ЧАСТИНА ГЕЙТА (ROADMAP D1). core-sys/build.rs збирає ті самі .c
      # крейтом `cc`, і тест звіряє хеші з тим самим core/scenario/golden.txt.
      # Тобто перевіряється не «cargo дає те саме, що make на цій машині», а
      # «cargo дає те саме, що еталон» — еталон один на всіх, і саме тому
      # окремого кроку «порівняти дві збірки» тут немає.
      #
      # CC передається той самий, що і в make: на linux-clang ядро для cargo
      # теж збере clang, і розбіжність gcc/clang усередині cargo впаде тут.
      #
      # Windows пропущено свідомо, а не забуто. Тулчейн Rust за замовчуванням
      # там MSVC, а core/cflags.txt написаний під gcc — потрібен
      # x86_64-pc-windows-gnu. Це записано боргом у ROADMAP D1; джоб
      # windows-mingw поки що перевіряє тільки збірку через make.
      # Програмний Vulkan для тестів рушія: без адаптера вони пропускаються,
      # а мовчазний пропуск — це зелений тест, який нічого не перевіряє.
      # macOS має Metal сам.
      - name: Mesa
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers

      - name: Cargo determinism
        if: runner.os != 'Windows'
        env:
          CC: ${{ matrix.cc }}
        run: |
          cargo run -q --example flags
          cargo test

      # Профіль cargo не має протікати в C: прапорці ядра задає
      # core/cflags.txt, а не рівень оптимізації Rust. Release-прогін і є
      # перевіркою цього твердження — хеші мусять лишитись ті самі.
      - name: Cargo determinism (release)
        if: runner.os != 'Windows'
        env:
          CC: ${{ matrix.cc }}
        run: cargo test --release

      - name: Clippy
        if: matrix.name == 'linux-gcc'
        env:
          CC: ${{ matrix.cc }}
        run: cargo clippy --all-targets -- -D warnings

      # Форматування — це не смак, а відсутність суперечки про смак. Приймаємо
      # rustfmt як є, включно з тими місцями, де він розбиває читабельний
      # однорядковий виклик на чотири.
      - name: Rustfmt
        if: matrix.name == 'linux-gcc'
        run: cargo fmt --check

      # Пам'ять межі C↔Rust (ROADMAP D3).
      #
      # Роадмап казав «Miri, або хоча б ASan». Тут valgrind, і це не
      # відступ через брак інструмента, а правильніший інструмент для цього
      # випадку: алокації живуть у C (`malloc` в ephemeris.c), Miri в C не
      # бачить узагалі, а ASan вимагав би перезібрати ядро з
      # -fsanitize=address — тобто з прапорцями, відмінними від
      # core/cflags.txt. Valgrind не потребує перезбірки й дивиться саме на
      # ту купу, про яку йдеться.
      #
      # Що це ловить, чого не ловить компілятор: `compile_fail`-доктести
      # доводять, що подвійне звільнення й використання після звільнення
      # неможливі за конструкцією типів. Вони НЕ доводять, що звільнення
      # взагалі відбувається. Витік — це не помилка типів, і побачити його
      # можна тільки так.
      #
      # ⚠ ТІЛЬКИ core-sys і core-rs, і це не економія часу.
      #
      # Перша версія ганяла valgrind по всіх тестових бінарниках, і на F3
      # вона впала: тести рушія створюють пристрій wgpu, той тягне програмний
      # Vulkan від Mesa, а Mesa губить 56 байт у стеку без жодного символу
      # (`???` — усередині dlopen-нутого драйвера). Це не наш код, ми його не
      # полагодимо, і робити з нього червоний гейт означає привчити себе
      # ігнорувати червоне.
      #
      # Межа C↔Rust — єдине місце, де пам'ять справді наша: там `malloc` у
      # ephemeris.c і `Drop` у core-rs. Рушій власної пам'яті не виділяє
      # взагалі, тож перевіряти в ньому нічого.
      - name: Valgrind
        if: matrix.name == 'linux-gcc'
        env:
          CC: ${{ matrix.cc }}
        run: |
          sudo apt-get update
          sudo apt-get install -y valgrind
          binaries=$(cargo test --no-run --message-format=json \
            | jq -r 'select(.profile.test == true and .executable != null)
                     | select(.package_id | test("core-sys|core-rs"))
                     | .executable')
          if [ -z "$binaries" ]; then
            echo "не знайдено жодного тестового бінарника core-sys/core-rs;"
            echo "порожня перевірка мовчки 'проходить', тому це провал"
            exit 1
          fi
          echo "$binaries" | while read -r binary; do
            echo "== $binary"
            valgrind --error-exitcode=1 \
                     --leak-check=full \
                     --errors-for-leak-kinds=definite \
                     "$binary"
          done

      # Завжди, навіть коли впало: у провалі саме хеші й потрібні.
      - name: Hashes
        if: always()
        run: cat build/scenario/actual.txt || true

      - name: Upload hashes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hashes-${{ matrix.name }}
          path: build/scenario/actual.txt
          if-no-files-found: warn
