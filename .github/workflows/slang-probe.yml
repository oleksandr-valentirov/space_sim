# P1 reconnaissance: does Slang's output reach wgpu (ROADMAP, stage E).
#
# Separate from gpu-probe.yml, because it is a separate question with separate
# dependencies: this one has to download the Slang compiler, that one does not.
# Same triggers: manual, and on changes to the probe itself. Reconnaissance is
# needed a few times per project, not per push.
#
# WARNING: there is no Windows here, deliberately. scripts/fetch_slang.sh
#   handles tar.gz for Linux and macOS; on Windows the release is a zip and the
#   path to slangc differs. Adding that branch for a reconnaissance whose
#   answer does not depend on the platform (naga parses WGSL the same on every
#   backend) is work without information. If it is ever needed, it is a quarter
#   of an hour.

name: slang-probe

on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/slang-probe/**'
      - 'scripts/fetch_slang.sh'
      - '.github/workflows/slang-probe.yml'

jobs:
  probe:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-latest
          - name: macos
            os: macos-latest

    steps:
      - uses: actions/checkout@v7

      # Without software Vulkan the Linux runner has no adapter, and the probe
      # is meant to draw, not merely compile.
      - name: Mesa
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers

      - name: Slang
        run: sh scripts/fetch_slang.sh

      - name: Probe
        run: cargo run -p slang-probe

      # The generated WGSL is committed (ROADMAP F2), so it can go stale:
      # someone edits a .slang and forgets to rebuild. slangc is already here,
      # so the check costs a second -- rebuild and look at the difference.
      #
      # Linux only: two jobs would rebuild the same thing and the second would
      # see the other's diff.
      - name: Shaders are up to date
        if: matrix.name == 'linux'
        run: |
          sh scripts/build_shaders.sh
          if ! git diff --exit-code -- engine/shaders; then
            echo ""
            echo "The committed WGSL does not match what slangc produces."
            echo "Rebuild and commit: sh scripts/build_shaders.sh"
            exit 1
          fi

      - name: Upload output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: slang-output-${{ matrix.name }}
          path: build/slang/
          if-no-files-found: warn
