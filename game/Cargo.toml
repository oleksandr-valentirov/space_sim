[package]
name = "game"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
publish = false

[dependencies]
# Гра володіє світом і часом; рушій малює те, що їй показати
# (PROJECT.md §6). Залежність однобічна й лишиться такою: `engine` про
# `game` не знає нічого.
core-rs = { path = "../core-rs" }
engine = { path = "../engine" }

# Два примітиви моделі потоків, і більше жодного (PROJECT.md §6): команди
# каналом, снапшоти публікацією. Спільного мутабельного стану немає, тож
# `Mutex` тут не з'являється — не з обережності, а тому, що нема чого
# замикати.
arc-swap = "1.9.2"
crossbeam-channel = "0.5.16"

wgpu = "30"
winit = "0.30"

[lints]
workspace = true
