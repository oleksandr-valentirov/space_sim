[package]
name = "game"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
publish = false

[dependencies]
# The game owns the world and time; the engine draws what it is shown
# (PROJECT.md §6). The dependency is one-way and will stay so: `engine` knows
# nothing about `game`.
core-rs = { path = "../core-rs" }
engine = { path = "../engine" }

# Two threading primitives and no more (PROJECT.md §6): commands by channel,
# snapshots by publication. There is no shared mutable state, so no `Mutex`
# appears here -- not out of caution but because there is nothing to lock.
arc-swap = "1.9.2"
crossbeam-channel = "0.5.16"

wgpu = "30"
winit = "0.30"

[lints]
workspace = true
