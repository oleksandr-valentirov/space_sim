[package]
name = "mesh-cook"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
publish = false

# Кукер мешів (ROADMAP, T5d2). Офлайновий, як і `dem-cook`: у гру не
# лінкується й у кадрі не виконується. PROJECT.md §7 забороняє сирі формати
# в рантаймі, тож glTF читається тут і ніде більше.

[dependencies]
# Формат скукованого меша живе в рушії (`engine::mesh`) — записувач і читач
# одного формату мусять бути одним кодом.
engine = { path = "../../engine" }

# JSON у glTF читається бібліотекою, а не руками, і це та сама межа, що в
# CLAUDE.md «чого НЕ робимо»: декодери чужих форматів не пишемо. Етикетка
# PDS3 у `dem-cook` — інший випадок: там формат саморобний рівно настільки,
# що бібліотеки для нього не існує. `.bin` при цьому читається сам —
# це масив чисел, а не формат.
serde_json = "1"

[lints]
workspace = true
