[package]
name = "mesh-cook"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
publish = false

# Mesh cooker (ROADMAP, T5d2). Offline like `dem-cook`: not linked into the
# game and not executed in a frame. PROJECT.md §7 forbids raw formats at
# runtime, so glTF is read here and nowhere else.

[dependencies]
# The cooked mesh format lives in the engine (`engine::mesh`) -- a format's
# writer and reader must be one piece of code.
engine = { path = "../../engine" }

# The JSON in glTF is read by a library rather than by hand, the same line
# CLAUDE.md draws under "what we do NOT write": no decoders for other people's
# formats. The PDS3 label in `dem-cook` is a different case: that format is
# home-made exactly to the degree that no library exists for it. The `.bin` is
# read directly -- it is an array of numbers, not a format.
serde_json = "1"

[lints]
workspace = true
