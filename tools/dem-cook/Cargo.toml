[package]
name = "dem-cook"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
publish = false

# Кукер рельєфу (ROADMAP-PLANETS.md, R5). Офлайновий: у гру не лінкується
# й у кадрі не виконується. PROJECT.md §7 забороняє завантажувати сирі
# формати в рантаймі, тож усе, що вміє цей крейт, робиться до запуску.
#
# Місячні джерела читаються без бібліотек, і це лишається так: формат LOLA
# GDR — прямокутник із `i16` у прямому порядку байтів і текстова етикетка
# PDS3 поруч, WAC той самий прямокутник із вбудованою етикеткою. Читати їх
# бібліотекою означало б принести десяток кілорядків заради двадцяти.
#
# Земля (T7) міняє не смак, а сам вміст файлу: ETOPO приходить GeoTIFF зі
# стисненням Deflate і floating-point предиктором, BMNG — JPEG. І стиснення,
# і декодери зображень стоять у списку «Чого НЕ робимо» (CLAUDE.md), тож
# розпакування тут чуже, а своє — лише інтерпретація тегів прив'язки.
[dependencies]
# Формат тайла живе в рушії (`engine::tiles`), бо записувач і читач одного
# формату мусять бути одним кодом. Напрямок залежності визначений однозначно:
# кукеру потрібна геометрія кубосфери, рушію кукер не потрібен зовсім.
engine = { path = "../../engine" }

# Контейнер ETOPO. Фічі за замовчуванням несуть і LZW, і JPEG-у-TIFF, яких
# продукту не треба; лишається сам Deflate.
tiff = { version = "0.11", default-features = false, features = ["deflate"] }

[lints]
workspace = true
