[package]
name = "dem-cook"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
publish = false

# Terrain cooker (ROADMAP-PLANETS.md, R5). Offline: not linked into the game
# and not executed in a frame. PROJECT.md §7 forbids loading raw formats at
# runtime, so everything this crate can do happens before launch.
#
# The lunar sources are read without libraries, and that stays: the LOLA GDR
# format is a rectangle of big-endian `i16` with a PDS3 text label beside it,
# and WAC is the same rectangle with an embedded label. Reading them with a
# library would mean importing ten kilolines for the sake of twenty.
#
# Earth (T7) changes not taste but the file contents themselves: ETOPO arrives
# as GeoTIFF with Deflate compression and a floating-point predictor, BMNG as
# JPEG. Both compression and image decoders are on the "what we do NOT write"
# list (CLAUDE.md), so the decompression here is someone else's and ours is
# only the interpretation of the georeferencing tags.
[dependencies]
# The tile format lives in the engine (`engine::tiles`), because a format's
# writer and reader must be one piece of code. The dependency direction is
# unambiguous: the cooker needs cubesphere geometry, the engine needs no cooker
# at all.
engine = { path = "../../engine" }

# The ETOPO container. Default features carry LZW and JPEG-in-TIFF, which the
# product does not need; only Deflate remains.
tiff = { version = "0.11", default-features = false, features = ["deflate"] }

# The BMNG mosaic. Pulls in `rayon` -- invariant 4 permits it exactly here
# ("only for LOD, tiles, the cooker"), and it does not touch output
# determinism: a picture is decompressed, not a sum computed.
jpeg-decoder = "0.3"

[lints]
workspace = true
