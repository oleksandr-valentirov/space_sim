[package]
name = "slang-probe"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
publish = false

[dependencies]
pollster = "1.0.1"

# The spirv feature enables SPIR-V parsing in naga. Without it only
# passthrough remains, which works on one backend -- and half of question P1
# would go unanswered.
wgpu = { version = "30", features = ["spirv"] }

[lints]
workspace = true
