# The workspace.
#
# Crates are added here as they appear rather than in advance: an empty crate in
# members breaks `cargo build`, which would be noise instead of a plan.

[workspace]
resolver = "2"
members = [
    "core-sys",
    "core-rs",
    "engine",
    "game",
    "tools/dem-cook",
    "tools/mesh-cook",
    "tools/star-cook",
    "tools/gpu-probe",
    "tools/slang-probe",
]

# The minimum Rust version.
#
# It was 1.75 -- that is what cargo demanded for the [lints] table. Then 1.87,
# demanded by wgpu 30, which arrived with reconnaissance P0 (tools/gpu-probe).
# Now 1.95, demanded by egui 0.36, which arrived with U1a (the game's interface,
# ROADMAP-UI.md). The threshold here is always someone else's -- it is set by the
# most demanding dependency, not by our code; rustup stable on the developer's
# machine is 1.97.1, so there is margin.
#
# The toolchain is set by rust-toolchain.toml, but only rustup reads that, so a
# system cargo from apt could build the project silently with the wrong one. Now
# it will not -- but it is measured that it fails NOT on this threshold: it first
# trips over a transitive dependency on edition2024 and speaks about that one.
# That is, loudly, but without explaining the reason. The reason is in README.md,
# "Версія Rust".
[workspace.package]
rust-version = "1.95"

# The release profile is touched deliberately and minimally. Rust optimisation
# does not affect the bitwise reproducibility of the core -- the numbers are
# computed by C, and its flags are set in core/cflags.txt, not here
# (PROJECT.md section 4).
[profile.release]
debug = true

# clippy is on, warnings = errors (CLAUDE.md, "Стиль Rust — свідомо простий").
#
# Only clippy's groups are here. "Compiler warnings = errors" is turned on in CI
# through `-D warnings` rather than here, and that is deliberate:
# `deny(warnings)` in the manifest makes every half-written variable an error
# while editing, i.e. gets in the way exactly when the code is being written. In
# CI it catches the same thing without scolding an unfinished thought.
[workspace.lints.clippy]
all = "deny"
