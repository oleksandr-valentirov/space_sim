# Робоча область. Поки що один член — межа C↔Rust (ROADMAP D1).
#
# Решта крейтів з PROJECT.md §3 (core-rs, engine, game, tools) додаються сюди
# у міру появи, а не наперед: порожній крейт у members ламає `cargo build`,
# і це був би шум замість плану.

[workspace]
resolver = "2"
members = [
    "core-sys",
    "core-rs",
    "engine",
    "game",
    "tools/gpu-probe",
    "tools/slang-probe",
]

# Мінімальна версія Rust.
#
# Було 1.75 — стільки вимагав cargo заради таблиці [lints]. Стало 1.87: цього
# вимагає wgpu 30, який приїхав із розвідкою P0 (tools/gpu-probe).
#
# Тулчейн задає rust-toolchain.toml, але його читає лише rustup, тож
# системний cargo з apt міг би зібрати проєкт мовчки й не тим. Тепер не
# зіб'є — але перевірено, що падає він НЕ на цьому порозі: спершу спотикається
# про транзитивну залежність на edition2024 і каже саме про неї. Тобто гучно,
# але не пояснюючи причини. Причина — у README.md, «Версія Rust».
[workspace.package]
rust-version = "1.87"

# Профіль релізу чіпаємо свідомо й мінімально. Оптимізація Rust на бітову
# відтворюваність ядра не впливає — числа рахує C, і його прапорці задані
# в core/cflags.txt, а не тут (PROJECT.md §4).
[profile.release]
debug = true

# clippy увімкнений, попередження = помилки (CLAUDE.md §«Стиль Rust»).
#
# Тут — лише групи clippy. «Попередження компілятора = помилки» вмикається
# в CI через `-D warnings`, а не тут, і це свідомо: `deny(warnings)` у
# маніфесті робить помилкою кожну недописану змінну під час редагування,
# тобто заважає рівно тоді, коли код пишуть. У CI воно ловить те саме,
# але не свариться на незакінчену думку.
[workspace.lints.clippy]
all = "deny"
