[package]
name = "core-sys"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
publish = false

# Declares the native library build.rs produces. Two effects: cargo will not
# let two crates link it twice, and build.rs can pass metadata further down the
# graph (DEP_CORE_*).
links = "core"

[build-dependencies]
cc = "1"

[lints]
workspace = true
