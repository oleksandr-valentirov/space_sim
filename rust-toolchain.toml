# Тулчейн проєкту. rustup читає цей файл і сам бере потрібне.
#
# Навіщо: на машині можуть співіснувати два cargo — системний з apt і той,
# що поставив rustup. Без цього файлу вибір залежав би від порядку в PATH,
# тобто ні від чого. Це той самий клас помилки, що й прапорці ядра у двох
# місцях: не падає, просто тихо збирає не тим.
#
# ⚠ Файл читає САМЕ rustup. Системний cargo з apt його не бачить і збиратиме
#   своєю версією. Як перевірити, чим збираєте, — README.md, «Версія Rust».
#
# channel = "stable", а не закріплена версія: відтворюваність у цьому проєкті
# живе не тут. Числа рахує C, його прапорці — в core/cflags.txt, а звірка —
# у хешах сценаріїв. Rust тут оркеструє, і закріплювати його патч-версію
# означало б обслуговувати те, що ні на що не впливає.

[toolchain]
channel = "stable"
components = ["clippy", "rustfmt"]
