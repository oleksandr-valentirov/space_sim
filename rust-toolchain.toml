# The project's toolchain. rustup reads this file and picks up what is needed.
#
# Why: two cargos can coexist on a machine -- the system one from apt and the one
# rustup installed. Without this file the choice would depend on the order in
# PATH, i.e. on nothing. That is the same class of bug as core flags kept in two
# places: it does not fail, it just quietly builds with the wrong one.
#
# WARNING: it is rustup SPECIFICALLY that reads this file. A system cargo from
#   apt does not see it and will build with its own version. How to check what
#   you are building with -- README.md, "Версія Rust".
#
# channel = "stable" rather than a pinned version: reproducibility in this
# project does not live here. The numbers are computed by C, its flags are in
# core/cflags.txt, and the comparison is in the scenario hashes. Rust
# orchestrates here, and pinning its patch version would mean maintaining
# something that affects nothing.

[toolchain]
channel = "stable"
components = ["clippy", "rustfmt"]
