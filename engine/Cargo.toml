[package]
name = "engine"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
publish = false

[dependencies]
# Межа C↔Rust. З H5 рушій рахує траєкторії сам, а не читає їх з CSV —
# `engine::live`. Ніякого `unsafe` це сюди не приносить: увесь він лишається
# в `core-rs` (CLAUDE.md, інваріант 1).
core-rs = { path = "../core-rs" }

pollster = "1.0.1"
wgpu = "30"
winit = "0.30"

# Знімок кадру у файл. Кодек не пишемо самі (PROJECT.md, «чого НЕ робимо»);
# png малий і робить рівно одне.
png = "0.18"

# Інтерфейс (ROADMAP-UI.md, U1). Провід живе тут, віджети пише `game` — і
# саме тому `engine` реекспортує `egui`: двох версій egui в грі не може
# виникнути за побудовою, а не за домовленістю.
#
# 0.36 вимагає wgpu ^30 і winit ^0.30.13 — рівно те, що вже стоїть вище.
# `egui-winit` без типових фіч: вони тягнуть `accesskit` з власним деревом
# залежностей, а доступність зараз не в обсязі. `links` тут не потрібен —
# сторонні крейти, не наші.
egui = "0.36"
egui-wgpu = "0.36"
egui-winit = { version = "0.36", default-features = false }

[lints]
workspace = true
