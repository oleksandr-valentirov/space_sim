[package]
name = "engine"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
publish = false

[dependencies]
# The C<->Rust boundary. Since H5 the engine computes trajectories itself rather
# than reading them from CSV -- `engine::live`. This brings no `unsafe` here: all
# of it stays in `core-rs` (CLAUDE.md, invariant 1).
core-rs = { path = "../core-rs" }

pollster = "1.0.1"
wgpu = "30"
winit = "0.30"

# A screenshot of the frame into a file. We do not write the codec ourselves
# (CLAUDE.md, "Чого НЕ робимо"); png is small and does exactly one thing.
png = "0.18"

# The interface (ROADMAP-UI.md, U1). The wiring lives here, the widgets are
# written by `game` -- and that is exactly why `engine` re-exports `egui`: two
# versions of egui in the game cannot arise by construction rather than by
# agreement.
#
# 0.36 requires wgpu ^30 and winit ^0.30.13 -- exactly what already stands above.
# `egui-winit` without default features: they pull in `accesskit` with a
# dependency tree of its own, and accessibility is out of scope for now. `links`
# is not needed here -- these are third-party crates, not ours.
egui = "0.36"
egui-wgpu = "0.36"
egui-winit = { version = "0.36", default-features = false }

# For the terrain tests only (R5c): to check that a tile reaches the frame, the
# test must cook it. The dependency is a `dev-` one specifically, i.e. the cooker
# is not linked into the game -- and the direction `dem-cook -> engine` is not
# reversed by it: `cargo` sees a cycle only between ordinary dependencies.
[dev-dependencies]
dem-cook = { path = "../tools/dem-cook" }

[lints]
workspace = true
